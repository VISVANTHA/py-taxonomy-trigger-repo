AWSTemplateFormatVersion: "2010-09-09"
Description: Scanner bait — public SSH ingress (checkov / kics CloudFormation)

Resources:
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Wide open SSH for IaC scanners
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"
